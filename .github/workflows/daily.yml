name: Collecte quotidienne et publication

on:
  schedule:
    - cron: "17 5 * * *"   # every day ~07:17 Paris (summer time)
  workflow_dispatch:
    inputs:
      only:
        description: "Sources to collect (comma separated)"
        default: "amazon,shopify,gtrends"
      weekly:
        description: "Generate the weekly article now (normally Mondays only)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "collector/**", "data/**", "extension/**"]   # bot commits use GITHUB_TOKEN and never re-trigger this

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}            # empty = Brevo; smtp.gmail.com for Gmail
      SMTP_LOGIN: ${{ secrets.SMTP_LOGIN }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Collect
        if: github.event_name != 'push'
        run: python -m collector.run --only "${{ inputs.only || 'amazon,shopify,gtrends' }}"

      - name: Weekly article (Mondays)
        if: github.event_name != 'push' && (inputs.weekly || github.event_name == 'schedule')
        run: |
          if [ "${{ inputs.weekly }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            python -m collector.weekly
          else
            echo "not Monday, no article"
          fi

      - name: Save snapshot
        if: github.event_name != 'push' && always()
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data editorial
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%F)"
          git pull --rebase --autostash && git push

      - name: Build site data
        if: always()
        run: |
          python -m collector.aggregate
          (cd extension && zip -qr ../site/releve-extension.zip . -x README.md)

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v4
        if: always()
        with:
          path: site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4

      # Sends the latest article once (newsletter_issues prevents duplicates); no-op without secrets.
      - name: Newsletter
        if: github.event_name != 'push' && steps.deploy.outcome == 'success'
        run: python -m collector.newsletter

      # Push notifications (new weekly article, new rush), each sent once; no-op without the VAPID secret.
      - name: Notifications
        if: github.event_name != 'push' && steps.deploy.outcome == 'success'
        run: |
          if [ -n "$VAPID_PRIVATE_KEY" ]; then
            pip install --quiet "pywebpush>=2,<3" && python -m collector.push
          else
            echo "push not configured"
          fi

      # Supabase pauses free projects after 7 days without activity: one tiny query per day.
      - name: Keep Supabase awake
        if: always()
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Supabase not configured"; exit 0; fi
          url="$(echo -n "$SUPABASE_URL" | tr -d '[:space:]')"; url="${url%/}"
          key="$(echo -n "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '[:space:]')"
          # Format checks only: secret values are never printed.
          [[ "$url" =~ ^https://[a-z0-9]{20}\.supabase\.co$ ]] && echo "SUPABASE_URL format: ok" \
            || echo "::error::SUPABASE_URL must look like https://<20 letters>.supabase.co (no path)"
          case "$key" in
            sb_secret_*) echo "SUPABASE_SERVICE_ROLE_KEY: secret key (sb_secret_)";;
            eyJ*) echo "SUPABASE_SERVICE_ROLE_KEY: legacy JWT key";;
            sb_publishable_*) echo "::error::SUPABASE_SERVICE_ROLE_KEY is the PUBLISHABLE key; use the secret key (sb_secret_...)";;
            *) echo "::error::SUPABASE_SERVICE_ROLE_KEY has an unknown format";;
          esac
          auth=(); case "$key" in sb_*) ;; *) auth=(-H "Authorization: Bearer $key");; esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/rest/v1/newsletter_issues?select=id&limit=1" \
            -H "apikey: $key" "${auth[@]}" || echo "000")
          echo "Supabase answered HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping failed (HTTP $code): 401 = wrong key, 404 = wrong URL, 000 = host unreachable"
            exit 1
          fi
